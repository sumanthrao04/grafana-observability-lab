services:

  # -------------------------------------------
  # PostgreSQL
  # -------------------------------------------
  postgres:
    image: postgres:16
    container_name: observability-postgres

    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -------------------------------------------
  # Spring Boot Application
  # -------------------------------------------
  demo:
    build:
      context: ./demo

    container_name: observability-demo

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: observability
      DB_USER: observability
      DB_PASSWORD: observability123

    depends_on:
      postgres:
        condition: service_healthy


  # -------------------------------------------
  # Prometheus
  # -------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: observability-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - demo


  # -------------------------------------------
  # Grafana
  # -------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus


  # -------------------------------------------
  # Loki
  # -------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: observability-loki

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki


  # -------------------------------------------
  # Alloy
  # -------------------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: observability-alloy

    ports:
      - "12345:12345"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"

    depends_on:
      - loki


# -------------------------------------------
# Persistent Volumes
# -------------------------------------------
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data: